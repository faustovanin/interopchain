services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: gateway
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      kafka:
        condition: service_started
    networks:
      - net-steward

  storage:
    build:
      context: .
      dockerfile: services/storage-service/Dockerfile
    container_name: storage
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_started
      ipfs-node:
        condition: service_started
      postgres:
        condition: service_started
    networks:
      - net-steward


  metadata-crypto:
    build:
      context: .
      dockerfile: services/metadata-crypto-service/Dockerfile
    container_name: metadata-crypto
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_started
    networks:
      - net-steward

  audit:
    build:
      context: .
      dockerfile: services/audit-service/Dockerfile
    container_name: audit
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_started
    networks:
      - net-steward

  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600

    networks:
      - net-steward

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8082:8080"
    depends_on:
      kafka:
        condition: service_started
    environment:
      KAFKA_CLUSTERS_0_NAME: net-steward
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - net-steward

  postgres:
    image: postgres:17

    container_name: ds-postgres

    environment:
      POSTGRES_DB: fhir
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    volumes:
      - postgres_data_dist:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

    ports:
      - "5432:5432"
    
    networks:
      - net-steward

  ipfs-node:
    build:
      context: ./ipfs-node/ipfs
    container_name: ipfs-node
    restart: unless-stopped
    env_file:
      - ./ipfs-node/.env
    environment:
      IPFS_API_PORT: ${IPFS_API_PORT:-5001}
      IPFS_GATEWAY_PORT: ${IPFS_GATEWAY_PORT:-8080}
      IPFS_SWARM_PORT: ${IPFS_SWARM_PORT:-4001}
      IPFS_BOOTSTRAP_PEERS: ${IPFS_BOOTSTRAP_PEERS:-}
      IPFS_SWARM_KEY_FILE: /swarm.key
      
    ports:
      - "${IPFS_SWARM_PORT:-4001}:${IPFS_SWARM_PORT:-4001}"
      - "${IPFS_API_PORT:-5001}:${IPFS_API_PORT:-5001}"
      - "${IPFS_GATEWAY_PORT:-8080}:${IPFS_GATEWAY_PORT:-8080}"
    volumes:
      - ./ipfs-node/ipfs/swarm.key:/swarm.key:ro
      - ipfs-data:/data/ipfs
    networks:
      - net-steward

  netbird:
    image: netbirdio/netbird:latest
    container_name: netbird-kafka

    hostname: net-distributed

    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - NET_RAW

    volumes:
      - ./netbird/client:/etc/netbird

    network_mode: host

    restart: unless-stopped

    command:
      - up
      - --management-url:https://api.netbird.io:443
      - --setup-key:${NETBIRD_SETUP_KEY}
      
networks:
  net-steward:

volumes:
  postgres_data_dist:
  ipfs-data: